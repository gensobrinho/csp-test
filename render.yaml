# Render Blueprint — API (@csp-test/api)
# Dashboard: New → Blueprint → connect this repo
# Neon is external: set DATABASE_URL when prompted (sync: false).

services:
  - type: web
    name: csp-test-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @csp-test/api exec prisma generate && pnpm --filter @csp-test/api build
    startCommand: pnpm --filter @csp-test/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BCRYPT_SALT_ROUNDS
        value: '10'
