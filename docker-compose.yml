services:
  postgres:
    image: postgres:16-alpine
    container_name: csp-kanban-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: csp_kanban
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - csp_kanban_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d csp_kanban']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  csp_kanban_pgdata:
